spring:
  application:
    name: api-gateway
  # How long the gateway waits for the backend before answering 504. Above the backend's slowest
  # route: top-matches waits up to 20 s for the LLM, after 5 s to connect to it.
  http:
    clients:
      connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:5s}
      read-timeout: ${GATEWAY_READ_TIMEOUT:30s}

# 8081 inside its container; compose publishes it on 8080, where the backend was (Day 16).
server:
  port: 8081

# The trace id and span id on every line, the access log's included.
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

# Tracing as the backend does it (Day 05): every request sampled, the trace id in every log line,
# and spans exported only when TRACING_EXPORT_ENABLED is set, to the same Tempo.
#
# Actuator on a port of its own, as the backend's (Day 38): compose does not publish it, so
# Prometheus scrapes it across the compose network and the public port routes no /actuator/**.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      # /actuator/health/readiness, UP only once the gateway has started: the public port listens
      # earlier, and a request in between is answered 500 (Day 38). Day 34's probes use it too.
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        # On by default, pushing to localhost:4318 every minute whether a collector is there or
        # not. Off unless an endpoint is given, as the backend's.
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

gateway:
  # The backend's base URL: http://backend:8080 in compose.
  backend-url: ${BACKEND_URL:http://localhost:8080}
  # The key set access tokens are verified with; the backend publishes it.
  jwks-url: ${gateway.backend-url}/.well-known/jwks.json
  rate-limit:
    # Login, register and the two password-reset steps, per client, per minute (Day 15).
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
  # A regex of proxy addresses whose X-Forwarded-For is believed. Empty believes none, as in compose:
  # the frontend passes a client's own header through (Day 16). Only a proxy that overwrites it.
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
