spring:
  application:
    name: jobmatch-job-service
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

app:
  # job-service's own key for service tokens (Day 39): a PEM, PKCS#8 file. No default on purpose:
  # without it, it does not start. Compose writes it with scripts/jwt-key.sh (Track C1).
  service-jwt:
    private-key-file: ${SERVICE_JWT_PRIVATE_KEY_FILE:}

  # Who may call /internal/** (Day 39, Day 17). The monolith has a property of its own, so an
  # environment list cannot wipe it; other callers are a list: APP_INTERNAL_TRUSTEDISSUERS_0_NAME
  # and APP_INTERNAL_TRUSTEDISSUERS_0_KEYSETURL. Compose and the harness set them (Tracks C1, C2).
  internal:
    backend-key-set-url: ${BACKEND_KEY_SET_URL:}
    # Where the counts client sends /internal/saved-counts: the monolith; compose and the harness
    # set it (Tracks C1, C2). Empty would mean this process, which has no such route.
    applications-url: ${INTERNAL_APPLICATIONS_URL:}

# Observability. Actuator listens on its own port, which compose and the ingress do not
# publish, so nothing here is reachable from the internet: on the application port every
# /actuator/** path falls through to SecurityConfig's anyRequest().authenticated() and
# answers 401. As the backend's, which says why.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# The internal clients' breakers, as the monolith's (Day 19): both exception lists named, since
# without them a 4xx counts as a failure, or with record-exceptions alone as a success. Only
# savedJobCounts here: it is job-service's one client; the other two stay the monolith's.
resilience4j:
  circuitbreaker:
    configs:
      internal:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      savedJobCounts:
        base-config: internal
