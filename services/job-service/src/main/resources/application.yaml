spring:
  application:
    name: jobmatch-job-service
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

app:
  # job-service's own key for service tokens (Day 39): a PEM, PKCS#8 file. No default on purpose:
  # without it, it does not start. Compose writes it with scripts/jwt-key.sh (Track C1).
  service-jwt:
    private-key-file: ${SERVICE_JWT_PRIVATE_KEY_FILE:}

# Observability. Actuator listens on its own port, which compose and the ingress do not
# publish, so nothing here is reachable from the internet: on the application port every
# /actuator/** path falls through to SecurityConfig's anyRequest().authenticated() and
# answers 401. As the backend's, which says why.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
