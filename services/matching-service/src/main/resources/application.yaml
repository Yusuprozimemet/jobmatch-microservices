spring:
  application:
    name: jobmatch-matching-service
  threads:
    virtual:
      enabled: true
  # Flyway applies db/matching to the service's schema, on the same role and history table as
  # the monolith did. An existing database sees V1 already applied.
  flyway:
    locations: classpath:db/matching
    schemas: matching
    create-schemas: false
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "tables moved in by V12-V14 in app"

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

app:
  # One login per module: matching_user on the matching schema, where matching-service reads and
  # writes job_match_scores and applies its migrations.
  datasource:
    matching:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project_db}?currentSchema=matching
      username: ${DB_MATCHING_USER:matching_user}
      password: ${DB_MATCHING_PASSWORD:password}
  # Required, no default on purpose (InternalUrls): empty meant "this process" in the monolith,
  # and this process serves none of identity's or job-service's routes.
  internal:
    identity-url: ${INTERNAL_IDENTITY_URL:}
    jobs-url: ${INTERNAL_JOBS_URL:}
  # identity's public key set for user tokens (Day 12), at identity's URL unless set.
  identity:
    jwks-url: ${IDENTITY_JWKS_URL:${app.internal.identity-url}/.well-known/jwks.json}
  # The key matching-service signs its service tokens with (Day 39, ServiceSigningKey): required,
  # no default; it does not start without one.
  service-jwt:
    private-key-file: ${SERVICE_JWT_PRIVATE_KEY_FILE:}
  # The score store (Day 22). The endpoint is blank on AWS and the emulator's URL elsewhere;
  # create-table is for compose and tests (production's table is Terraform's).
  scores:
    endpoint: ${SCORES_DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:eu-west-1}
    table: ${SCORES_TABLE:job_match_scores}
    create-table: ${SCORES_CREATE_TABLE:false}
    # The whole call, retries included (one read and two writes per request).
    api-call-timeout: 500ms
  # The model call: the gateway reads for 30 s; top-matches makes three internal calls in a row
  # (existence, profile, shortlist), each 1 s connect and 2 s read, one score read at 0.5 s, the
  # model call 5 s connect and this read, two score writes at 0.5 s each: 9 + 0.5 + 5 + 13 + 1 = 28.5 s.
  # The monolith's 20 made 34 s.
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${LLM_MODEL:gemini-flash-lite-latest}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:13}
    # Sent as reasoning_effort - cuts response time for models that reason by default.
    # Leave empty for a provider that rejects the field.
    reasoning-effort: ${LLM_REASONING_EFFORT:low}
    # How long a stored score stays valid. Reads already skip expired ones; the hourly
    # purge just frees the space.
    score-retention-days: ${LLM_SCORE_RETENTION_DAYS:1}
    score-purge-cron: ${LLM_SCORE_PURGE_CRON:0 0 * * * *}

# Observability. Actuator listens on its own port, which compose does not publish, so nothing
# here is reachable from the internet.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# The internal clients' breakers, as the monolith's (Day 19): both exception lists named, since
# without them a 4xx counts as a failure, or with record-exceptions alone as a success. The three
# are matching's clients: profileDirectory, userExistence, postingShortlist.
resilience4j:
  circuitbreaker:
    configs:
      internal:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      profileDirectory:
        base-config: internal
      userExistence:
        base-config: internal
      postingShortlist:
        base-config: internal
  # The model call's bulkhead (Day 21): ten calls at most, none waiting; a full bulkhead answers
  # in skill-overlap order.
  bulkhead:
    instances:
      modelCall:
        max-concurrent-calls: 10
        max-wait-duration: 0ms
