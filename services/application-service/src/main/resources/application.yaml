spring:
  application:
    name: jobmatch-application-service
  threads:
    virtual:
      enabled: true
  # Its own database (Day 25): apps_db, where only applications_user may connect
  # (scripts/db-init/30-apps-db.sh, scripts/db-setup.py). The admin creates the schema;
  # applications_user owns it and has no CREATE on the database.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apps_db}?currentSchema=applications
    username: ${DB_APPLICATIONS_USER:applications_user}
    password: ${DB_APPLICATIONS_PASSWORD:password}
    # Small: the test run caches several contexts on one Postgres.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  # Its own migrations, as applications_user, with the history table in the schema they write.
  # The schema exists already, empty, so there is nothing to baseline.
  flyway:
    schemas: applications
    create-schemas: false
    locations: classpath:db/applications

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "

app:
  # Required, no default on purpose (InternalUrls): empty meant "this process" in the monolith,
  # and this process serves none of identity's or job-service's routes.
  internal:
    identity-url: ${INTERNAL_IDENTITY_URL:}
    jobs-url: ${INTERNAL_JOBS_URL:}
    # Who may call /internal/** (Day 39, Day 25). job-service has a property of its own, so an
    # environment list cannot wipe it; other callers are a list: APP_INTERNAL_TRUSTEDISSUERS_0_NAME
    # and APP_INTERNAL_TRUSTEDISSUERS_0_KEYSETURL. Compose and the harness set them (Tracks C1, C2).
    job-service-key-set-url: ${JOB_SERVICE_KEY_SET_URL:}
  # identity's public key set for user tokens (Day 12), at identity's URL unless set.
  identity:
    jwks-url: ${IDENTITY_JWKS_URL:${app.internal.identity-url}/.well-known/jwks.json}
  # The key application-service signs its service tokens with (Day 39, ServiceSigningKey): required,
  # no default; it does not start without one.
  service-jwt:
    private-key-file: ${SERVICE_JWT_PRIVATE_KEY_FILE:}
  # The user.deleted consumer (Day 27, moved here on Day 25). Off by default: compose turns it on
  # with the queue it reads (Track E2); the harness's container reads a queue of its own.
  events:
    consumer:
      enabled: ${EVENTS_CONSUMER_ENABLED:false}
    sqs:
      endpoint: ${EVENTS_SQS_ENDPOINT:}
      region: ${EVENTS_SQS_REGION:eu-west-1}
      access-key: ${EVENTS_SQS_ACCESS_KEY:}
      secret-key: ${EVENTS_SQS_SECRET_KEY:}
    user-deleted-queue-url: ${EVENTS_USER_DELETED_QUEUE_URL:}

# Observability. Actuator listens on its own port, which compose does not publish, so nothing
# here is reachable from the internet.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
  tracing:
    sampling:
      probability: ${TRACING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# The internal clients' breakers, as the monolith's (Day 19): both exception lists named, since
# without them a 4xx counts as a failure, or with record-exceptions alone as a success. The two
# are application-service's clients: postingLookup (job-service), userExistence (identity).
resilience4j:
  circuitbreaker:
    configs:
      internal:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      postingLookup:
        base-config: internal
      userExistence:
        base-config: internal
