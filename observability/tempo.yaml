# Single-binary Tempo with local storage. Enough to look at this morning's traces on a
# laptop, and deliberately not enough for anything else - Phase 7 replaces it.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Flush quickly so a trace shows up while you are still looking for it.
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
