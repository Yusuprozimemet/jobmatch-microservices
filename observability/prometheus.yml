# Scrapes the backend's and the gateway's management ports, which docker-compose does not
# publish to the host. That is the whole reason the actuator listens on a port of its own: Prometheus
# reaches it across the compose network, and nothing on the internet can.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: jobmatch-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9090"]
  # The gateway's own actuator (Day 38), on the same port number inside its container.
  - job_name: jobmatch-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:9090"]
