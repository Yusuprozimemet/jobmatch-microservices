services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # The module roles' passwords, read by scripts/db-init/module-roles.sh on an empty volume.
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-password}
      APPLICATIONS_DB_PASSWORD: ${APPLICATIONS_DB_PASSWORD:-password}
      MATCHING_DB_PASSWORD: ${MATCHING_DB_PASSWORD:-password}
      JOBS_DB_PASSWORD: ${JOBS_DB_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Writes identity's user key and the monolith's service key (Day 39). Runs and exits: it
  # writes both keys into the jwt-keys volume on the first start and keeps them after that, until
  # `docker compose down -v`. Never in git, and never made by the backend, which does not start
  # without them. The backend's own runtime image, because it already has openssl and is already
  # pulled.
  jwt-key:
    image: eclipse-temurin:25-jre
    command: ["sh", "-c", "sh /jwt-key.sh /keys/private.pem && sh /jwt-key.sh /keys/service.pem"]
    volumes:
      - jwt-keys:/keys
      - ./scripts/jwt-key.sh:/jwt-key.sh:ro

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      # application-prod.yaml builds the JDBC URL from DB_PORT and nothing set it, so the
      # backend could not start under compose at all: "JDBC URL invalid port number:
      # ${DB_PORT}". Pre-existing, found while bringing up the obs stack for this day.
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      # The owner of the migrations; only Flyway logs in as it (Day 11).
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # One login per module, created by scripts/db-init/ on an empty volume.
      DB_IDENTITY_USER: identity_user
      DB_IDENTITY_PASSWORD: ${IDENTITY_DB_PASSWORD:-password}
      DB_APPLICATIONS_USER: applications_user
      DB_APPLICATIONS_PASSWORD: ${APPLICATIONS_DB_PASSWORD:-password}
      DB_MATCHING_USER: matching_user
      DB_MATCHING_PASSWORD: ${MATCHING_DB_PASSWORD:-password}
      DB_JOBS_USER: jobs_user
      DB_JOBS_PASSWORD: ${JOBS_DB_PASSWORD:-password}
      # Tracing is opt-in: empty means no exporter, so the application still starts with
      # nowhere to send spans. Point it at the Tempo below to turn it on:
      #
      #   TRACING_EXPORT_ENABLED=true docker compose --profile obs up
      #
      # The endpoint already points at the Tempo below, so that one variable is enough.
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      # Written by jwt-key above, read-only here.
      JWT_PRIVATE_KEY_FILE: /run/keys/private.pem
      SERVICE_JWT_PRIVATE_KEY_FILE: /run/keys/service.pem
    volumes:
      - jwt-keys:/run/keys:ro
    # No published port (Day 16): the gateway below is the way in, on 8080. 9090, the management
    # port, is not published either; Prometheus reaches it over the compose network.
    depends_on:
      db:
        condition: service_healthy
      jwt-key:
        condition: service_completed_successfully

  # The API gateway (Day 15), the only way in to the backend: published on 8080, where the
  # backend used to be (Day 16). It listens on 8081 inside the network.
  #
  # GATEWAY_TRUSTED_PROXIES is left unset on purpose. The frontend passes a client's own
  # X-Forwarded-For through, so believing it would let a client pick a new rate-limit bucket per
  # request; every browser shares the frontend's bucket instead.
  api-gateway:
    build: ./services/api-gateway
    environment:
      BACKEND_URL: http://backend:8080
      # Tracing as the backend's, above: off unless TRACING_EXPORT_ENABLED=true, to the same Tempo.
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
    ports:
      - "8080:8081"
    # The gateway can answer 500 for a few hundred ms after its port opens (Day 38, #123/#124);
    # healthy only once readiness is UP on the management port 9090, not published. The runtime
    # image has no curl/wget/nc but has bash, so bash's /dev/tcp. Short interval/start_interval
    # keep up --wait from waiting Docker's default 30 s.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      BACKEND_API_URL: http://api-gateway:8081
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_healthy

  # The two data jobs. Neither is started by `docker compose up`: they run and
  # exit, it is not a service. A container job you add later shares this
  # image and differs only in the command, which is how Container Apps jobs are
  # configured in Azure.
  #
  #   docker compose build pipeline          build the image the job uses
  #   docker compose run --rm pipeline       the ingestion job
  #
  # Neither can authenticate to Azure from your laptop: a container has no
  # `az login` and no metadata service. Build here, run in Azure, and use
  # `uv run python -m src.ingestion.pipeline` when you want to run something locally.
  pipeline:
    build: ./data
    image: final-project-pipeline
    profiles: [data]
    # Optional, like the Airflow override's. Older Compose versions read every
    # service's env_file while loading the project, even for an inactive
    # profile, which made `docker compose up -d db` fail on a clean clone
    # before anyone had written data/.env.
    env_file:
      - path: ./data/.env
        required: false
    environment:
      # Reach the database by its service name on the compose network.
      BACKEND_PG_HOST: db
      BACKEND_PG_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  # The local observability stack. Started only by `docker compose --profile obs up`, so
  # `docker compose up` is exactly what it was for everyone who does not want it.
  #
  # Grafana is at http://localhost:3001 - 3000 belongs to the frontend - and needs no
  # login. Phase 7 replaces all three with the real thing; this is for a laptop.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  tempo:
    image: grafana/tempo:2.7.0
    profiles: [obs]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:11.5.1
    profiles: [obs]
    environment:
      # A laptop stack behind no network. Asking for a password here only means everyone
      # types admin/admin, which teaches the wrong habit more effectively than no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana/jobmatch.json:/etc/grafana/provisioning/dashboards/jobmatch.json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  db-data:
  tempo-data:
  jwt-keys:

networks:
  default:
    name: finalproject
