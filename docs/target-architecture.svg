<!-- title and legend -->
<text class="t" x="700" y="38" font-size="28" text-anchor="middle">JobMatch after the migration: the target architecture</text>
<text class="upn" x="440" y="71" font-size="14" text-anchor="middle">1</text>
<text class="lb" x="458" y="71" font-size="15">top-matches request</text>
<text class="dnn" x="650" y="71" font-size="14" text-anchor="middle">A</text>
<text class="lb" x="668" y="71" font-size="15">delete an account (GDPR)</text>
<text class="lb" x="915" y="71" font-size="15">async, data sync, Phase 6 upload</text>

<!-- edge text -->
<text class="t" x="252" y="127" font-size="19" text-anchor="middle">Edge: the only way in</text>
<text class="t" x="65" y="375" font-size="18" text-anchor="middle">User</text>
<text class="t" x="252" y="198" font-size="18" text-anchor="middle">Frontend</text>
<text class="st" x="252" y="219" font-size="13" text-anchor="middle">Next.js, unchanged</text>
<text class="t" x="252" y="314" font-size="18" text-anchor="middle">Ingress</text>
<text class="st" x="252" y="336" font-size="13" text-anchor="middle">ingress-nginx + TLS</text>
<text class="lb" x="264" y="266" font-size="12">pages</text>
<text class="upn" x="125" y="324" font-size="14" text-anchor="middle">1</text>
<text class="upn" x="274" y="388" font-size="14" text-anchor="middle">2</text>
<text class="lb" x="292" y="388" font-size="12">/api/*</text>
<text class="t" x="250" y="433" font-size="18" text-anchor="middle">API Gateway</text>
<text class="st" x="250" y="453" font-size="13" text-anchor="middle">Spring Cloud Gateway</text>
<text class="st" x="250" y="472" font-size="13" text-anchor="middle">verifies JWT (JWKS)</text>
<text class="st" x="250" y="491" font-size="13" text-anchor="middle">rate limit, adds X-User-Id</text>
<text class="lb" x="267" y="549" font-size="12">count</text>
<text class="t" x="255" y="600" font-size="16" text-anchor="middle">Rate-limit store</text>
<text class="st" x="255" y="618" font-size="12" text-anchor="middle">shared by all replicas</text>

<!-- cluster text -->
<text class="st" x="418" y="125" font-size="15">AKS cluster (Kubernetes)</text>
<text class="t" x="565" y="167" font-size="19" text-anchor="middle">Services: containers</text>
<text class="t" x="565" y="230" font-size="18" text-anchor="middle">identity-service</text>
<text class="st" x="565" y="251" font-size="13" text-anchor="middle">auth + user + profile</text>
<text class="st" x="565" y="270" font-size="13" text-anchor="middle">signs JWTs, serves JWKS</text>
<text class="st" x="565" y="289" font-size="13" text-anchor="middle">outbox: user.deleted</text>
<text class="t" x="565" y="370" font-size="18" text-anchor="middle">matching-service</text>
<text class="st" x="565" y="391" font-size="13" text-anchor="middle">shortlist + LLM scorer</text>
<text class="st" x="565" y="410" font-size="13" text-anchor="middle">20 s LLM call isolated here</text>
<text class="st" x="565" y="429" font-size="13" text-anchor="middle">scales on CPU (HPA)</text>
<text class="t" x="565" y="510" font-size="18" text-anchor="middle">job-service</text>
<text class="st" x="565" y="531" font-size="13" text-anchor="middle">search, read-only postings</text>
<text class="st" x="565" y="550" font-size="13" text-anchor="middle">internal: batch, shortlist</text>
<text class="t" x="565" y="620" font-size="18" text-anchor="middle">application-service</text>
<text class="st" x="565" y="641" font-size="13" text-anchor="middle">saved jobs + tracker</text>
<text class="lb" x="556" y="587" font-size="11">postings, saved counts</text>
<text class="upn" x="542" y="335" font-size="14" text-anchor="middle">4</text>
<text class="lb" x="560" y="335" font-size="12">skills</text>
<text class="upn" x="622" y="474" font-size="14" text-anchor="middle">5</text>
<text class="lb" x="640" y="474" font-size="12">shortlist</text>
<text class="upn" x="399" y="441" font-size="14" text-anchor="middle">3</text>

<!-- data text -->
<text class="st" x="768" y="125" font-size="15">managed, not in the cluster</text>
<text class="t" x="880" y="167" font-size="19" text-anchor="middle">Data: one store each</text>
<text class="t" x="880" y="240" font-size="17" text-anchor="middle">identity DB</text>
<text class="st" x="880" y="259" font-size="12" text-anchor="middle">Postgres: users, profiles,</text>
<text class="st" x="880" y="276" font-size="12" text-anchor="middle">refresh tokens, outbox</text>
<text class="t" x="880" y="390" font-size="17" text-anchor="middle">Cosmos DB</text>
<text class="st" x="880" y="408" font-size="12" text-anchor="middle">match scores,</text>
<text class="st" x="880" y="424" font-size="12" text-anchor="middle">expire by TTL</text>
<text class="t" x="880" y="522" font-size="17" text-anchor="middle">jobs DB</text>
<text class="st" x="880" y="540" font-size="12" text-anchor="middle">Postgres: fct_postings</text>
<text class="t" x="880" y="630" font-size="17" text-anchor="middle">applications DB</text>
<text class="st" x="880" y="648" font-size="12" text-anchor="middle">Postgres: saved_jobs</text>
<text class="upn" x="733" y="391" font-size="14" text-anchor="middle">6</text>
<text class="upn" x="746" y="446" font-size="14" text-anchor="middle">7</text>
<text class="lb" x="880" y="452" font-size="12" text-anchor="middle">score only the misses</text>
<text class="dnn" x="399" y="352" font-size="14" text-anchor="middle">A</text>
<text class="dnn" x="733" y="251" font-size="14" text-anchor="middle">B</text>
<text class="lb" x="735" y="284" font-size="11" text-anchor="middle">1 transaction</text>
<text class="dnn" x="965" y="101" font-size="14" text-anchor="middle">C</text>
<text class="lb" x="860" y="89" font-size="12" text-anchor="middle">relay publishes user.deleted</text>
<text class="dnn" x="1024" y="341" font-size="14" text-anchor="middle">D</text>
<text class="lb" x="880" y="321" font-size="11" text-anchor="middle">delete this user's data</text>
<text class="dnn" x="1074" y="396" font-size="14" text-anchor="middle">D</text>
<text class="lb" x="880" y="570" font-size="11" text-anchor="middle">delete saved jobs</text>

<!-- outside text -->
<text class="t" x="1210" y="127" font-size="19" text-anchor="middle">Outside the cluster</text>
<text class="t" x="1127" y="290" font-size="16" text-anchor="middle">Message bus</text>
<text class="t" x="1127" y="458" font-size="16" text-anchor="middle">LLM API</text>
<text class="st" x="1127" y="477" font-size="12" text-anchor="middle">OpenAI-compatible</text>
<text class="t" x="1127" y="586" font-size="16" text-anchor="middle">Google</text>
<text class="st" x="1127" y="605" font-size="12" text-anchor="middle">sign-in (OAuth)</text>
<text class="t" x="1297" y="214" font-size="16" text-anchor="middle">uploads</text>
<text class="st" x="1297" y="232" font-size="12" text-anchor="middle">private blob storage</text>
<text class="lam" x="1236" y="327" font-size="30" text-anchor="middle">λ</text>
<text class="t" x="1310" y="302" font-size="16" text-anchor="middle">cv-parse</text>
<text class="st" x="1310" y="320" font-size="11" text-anchor="middle">finds skills in a CV,</text>
<text class="st" x="1310" y="336" font-size="11" text-anchor="middle">PUTs them to identity</text>
<text class="lam" x="1236" y="432" font-size="30" text-anchor="middle">λ</text>
<text class="t" x="1310" y="407" font-size="16" text-anchor="middle">mailer</text>
<text class="st" x="1310" y="425" font-size="11" text-anchor="middle">queue-triggered mail</text>
<text class="st" x="1310" y="441" font-size="11" text-anchor="middle">(may be cut)</text>
<text class="t" x="1295" y="586" font-size="16" text-anchor="middle">Key Vault</text>
<text class="st" x="1295" y="605" font-size="11" text-anchor="middle">secrets reach pods via</text>
<text class="st" x="1295" y="620" font-size="11" text-anchor="middle">External Secrets</text>
<text class="lb" x="720" y="705" font-size="13" text-anchor="middle">a CV goes straight to blob storage with a short-lived SAS URL from identity (Phase 6)</text>
<text class="lb" x="1022" y="662" font-size="11" text-anchor="end">publish</text>

<!-- card: built and deployed -->
<text class="t" x="50" y="745" font-size="16">Built and deployed by</text>
<text class="st" x="50" y="772" font-size="13">One IaC tool (chosen in Phase 7): AKS,</text>
<text class="st" x="50" y="792" font-size="13">Postgres, Cosmos DB, storage, Key Vault</text>
<text class="st" x="50" y="812" font-size="13">Helm: charts/common + a thin chart each</text>
<text class="st" x="50" y="832" font-size="13">Argo CD syncs deploy/argocd (GitOps)</text>
<text class="st" x="50" y="852" font-size="13">Flyway runs as a pre-upgrade hook Job</text>
<text class="st" x="50" y="880" font-size="13">CI per service on every push: unit tests →</text>
<text class="st" x="50" y="900" font-size="13">Day 1–4 contract tests (unedited) →</text>
<text class="st" x="50" y="920" font-size="13">checkstyle → image → Argo CD sync</text>

<!-- card: score cache -->
<text class="t" x="570" y="743" font-size="15" text-anchor="middle">matching-service: scoring one posting</text>
<text class="st" x="570" y="768" font-size="13" text-anchor="middle">Is (skills_hash, posting_id, scorer_version)</text>
<text class="st" x="570" y="786" font-size="13" text-anchor="middle">already in Cosmos DB?</text>
<text class="t" x="490" y="840" font-size="15" text-anchor="middle">no</text>
<text class="t" x="652" y="840" font-size="15" text-anchor="middle">yes</text>
<text class="st" x="415" y="864" font-size="13">1. ask the LLM (20 s timeout)</text>
<text class="st" x="415" y="884" font-size="13">2. save the score, with a TTL</text>
<text class="st" x="415" y="904" font-size="13">3. return it</text>
<text class="t" x="652" y="866" font-size="15" text-anchor="middle">return it</text>
<text class="st" x="652" y="884" font-size="12" text-anchor="middle">(no LLM call)</text>
<text class="lb" x="570" y="926" font-size="12" text-anchor="middle">the TTL replaces the old cleanup job</text>

<!-- card: data pipeline -->
<text class="t" x="780" y="745" font-size="16">Data pipeline</text>
<text class="st" x="780" y="765" font-size="12">unchanged by the migration</text>
<text class="st" x="780" y="792" font-size="13">Airflow, on a schedule:</text>
<text class="st" x="780" y="814" font-size="13">1. ingest job postings</text>
<text class="st" x="780" y="834" font-size="13">2. Databricks + dbt build</text>
<text class="st" x="780" y="854" font-size="13">3. publish fct_postings</text>
<text class="st" x="780" y="872" font-size="13">    into the jobs DB</text>
<text class="lb" x="780" y="904" font-size="12">re-pointed there on Day 20</text>

<!-- card: observability -->
<text class="t" x="1055" y="745" font-size="16">Observability</text>
<text class="st" x="1055" y="772" font-size="13">Alloy collects from every pod</text>
<text class="st" x="1055" y="792" font-size="13">Prometheus: metrics</text>
<text class="st" x="1055" y="812" font-size="13">Tempo: traces</text>
<text class="st" x="1055" y="832" font-size="13">Grafana: dashboards</text>
<text class="st" x="1055" y="864" font-size="13">one trace id per request:</text>
<text class="st" x="1055" y="884" font-size="13">gateway → service → LLM</text>
<text class="t" x="1335" y="835" font-size="14" text-anchor="middle">Grafana</text>

<text class="st" x="700" y="958" font-size="12" text-anchor="middle">From plan.md. Phases 3–5 are the extractions under way; Phases 6–7 (uploads, functions, Kubernetes) are provisional until the Day 28 evaluation.</text>
</svg>
