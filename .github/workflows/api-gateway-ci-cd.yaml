name: API Gateway CI/CD

on:
  push:
    branches: [main]
    paths:
      - "services/api-gateway/**"
      - "backend/checkstyle.xml"
      - ".github/workflows/api-gateway-ci-cd.yaml"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - "backend/checkstyle.xml"
      - ".github/workflows/api-gateway-ci-cd.yaml"

concurrency:
  group: docker-build-api-gateway-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The backend's Maven wrapper and checkstyle rules, so the repository keeps one of each.
      - name: Run Checkstyle
        run: backend/mvnw -B -f services/api-gateway/pom.xml checkstyle:check

      - name: Run tests
        run: backend/mvnw -B -f services/api-gateway/pom.xml verify

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/api-gateway
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./services/api-gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,scope=api-gateway,mode=max
