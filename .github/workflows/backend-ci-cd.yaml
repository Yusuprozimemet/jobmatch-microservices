name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # The suite also runs through the gateway, so a gateway change runs it too (Day 15).
      - "services/api-gateway/**"
      - ".github/workflows/backend-ci-cd.yaml"
  pull_request:
    paths:
      - "backend/**"
      # The suite also runs through the gateway, so a gateway change runs it too (Day 15).
      - "services/api-gateway/**"
      - ".github/workflows/backend-ci-cd.yaml"

# Cancel previous runs on new pushes
concurrency:
  group: docker-build-backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 0
  PATCH_VERSION: ${{ github.run_number }}
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Checkstyle
        working-directory: ./backend
        run: ./mvnw -B checkstyle:check

      # `verify`, not `test`: the integration tests are the safety net for the microservices
      # split, so a pull request that breaks one has to fail here. They need a Docker daemon
      # for Testcontainers, which ubuntu-latest has.
      - name: Run tests
        working-directory: ./backend
        run: ./mvnw -B verify

      # The Day 1-4 suite, and the stale-cookie and refresh tests, again through the API gateway
      # (Day 15): the harness starts this image in front of the application and sends every
      # request through it. In addition to the run above, never instead: only that one shows the
      # backend still checks tokens itself.
      - name: Build the gateway image
        run: docker build -t jobmatch-api-gateway:harness services/api-gateway

      - name: Run the suite through the gateway
        working-directory: ./backend
        run: >-
          ./mvnw -B verify -pl app -am -Dharness.gateway=true
          -Dtest='nl.hackyourfuture.project.backend.contract.*IT,StaleCookieIT,RefreshIT,GatewayHarnessIT'
          -Dsurefire.failIfNoSpecifiedTests=false

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }},enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      # Push only on main branch, otherwise just build
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
