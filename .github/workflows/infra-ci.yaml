# Infra checks: format, validate, plan with fake credentials, LocalStack lock test and apply,
# secret sweep, and bus checks (comparing Terraform against compose LocalStack).
# No AWS credentials, no job that applies to AWS.

name: Infra checks

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/bus-init/**"
      - "scripts/infra-checks.py"
      - "scripts/infra-summary.py"
      - "scripts/test_infra_summary.py"
      - "docker-compose.yml"
      - "services/matching-service/**/ScoreStoreConfig.java"
      - "services/*/Dockerfile"
      - "services/*/src/main/resources/application.yaml"
      - "services/identity-service/app/src/main/resources/application.yaml"
      - "observability/**"
      - "services/identity-service/**/support/EventBus.java"
      - ".github/workflows/api-gateway-ci-cd.yaml"
      - ".github/workflows/application-service-ci-cd.yaml"
      - ".github/workflows/db-setup-tests.yml"
      - ".github/workflows/frontend-ci-cd.yaml"
      - ".github/workflows/identity-service-ci-cd.yaml"
      - ".github/workflows/job-service-ci-cd.yaml"
      - ".github/workflows/matching-service-ci-cd.yaml"
      - ".github/workflows/infra-ci.yaml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "scripts/bus-init/**"
      - "scripts/infra-checks.py"
      - "scripts/infra-summary.py"
      - "scripts/test_infra_summary.py"
      - "docker-compose.yml"
      - "services/matching-service/**/ScoreStoreConfig.java"
      - "services/*/Dockerfile"
      - "services/*/src/main/resources/application.yaml"
      - "services/identity-service/app/src/main/resources/application.yaml"
      - "observability/**"
      - "services/identity-service/**/support/EventBus.java"
      - ".github/workflows/api-gateway-ci-cd.yaml"
      - ".github/workflows/application-service-ci-cd.yaml"
      - ".github/workflows/db-setup-tests.yml"
      - ".github/workflows/frontend-ci-cd.yaml"
      - ".github/workflows/identity-service-ci-cd.yaml"
      - ".github/workflows/job-service-ci-cd.yaml"
      - ".github/workflows/matching-service-ci-cd.yaml"
      - ".github/workflows/infra-ci.yaml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks without an AWS account
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1

    services:
      localstack:
        image: localstack/localstack:4.14.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3,sns,sqs,dynamodb,cloudwatch,sts,iam
          AWS_DEFAULT_REGION: eu-west-1
        options: >-
          --health-cmd "curl -sf localhost:4566/_localstack/health"
          --health-interval 2s
          --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the infra summary
        run: python scripts/test_infra_summary.py

      - name: Install Python dependencies
        run: pip install boto3 awscli-local pyyaml

      # C34.2: the pinned collector starts on the configuration, as the sidecar will get it
      # (AOT_CONFIG_CONTENT). The image has no shell and its health port listens on localhost
      # inside the container, so its own /healthcheck binary is run with docker exec. The binary
      # writes its status line to stderr, hence 2>&1.
      - name: collector starts
        id: collector
        run: |
          image=$(sed -n 's/^ *collector_image *= *"\(.*\)"$/\1/p' infra/terraform/collector.tf)
          test -n "$image"
          # Public ECR throttles anonymous pulls per second and runners share their IPs (the
          # first run of PR #379: "toomanyrequests: Rate exceeded"), so the pull is retried.
          for wait in 5 10 20 40 0; do
            docker pull -q "$image" && break
            [ "$wait" -gt 0 ] || exit 1
            sleep "$wait"
          done
          docker run -d --name collector \
            -e AWS_REGION=eu-west-1 -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test \
            -e AOT_CONFIG_CONTENT="$(cat infra/terraform/collector.yaml)" "$image"
          for _ in $(seq 1 30); do
            if docker exec collector /healthcheck 2>&1 | grep -q "STATUS: 200"; then
              exit 0
            fi
            sleep 2
          done
          docker logs collector 2>&1 | tail -40
          exit 1

      - name: fmt
        id: fmt
        run: terraform fmt -check -recursive infra/terraform

      - name: validate
        id: validate
        run: |
          for root in infra/terraform/bootstrap infra/terraform infra/terraform/localstack; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: plan without an account
        id: plan
        run: |
          # Bootstrap plan
          cat > infra/terraform/bootstrap/ci_override.tf << 'EOF'
          provider "aws" {
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF

          terraform -chdir=infra/terraform/bootstrap init -reconfigure -input=false
          terraform -chdir=infra/terraform/bootstrap plan -input=false -out=tfplan \
            -var alert_email=alerts@example.com
          terraform -chdir=infra/terraform/bootstrap show -json tfplan > "$RUNNER_TEMP/bootstrap-plan.json"

          # Main root plan
          cat > infra/terraform/ci_override.tf << 'EOF'
          terraform {
            backend "local" {}
          }
          provider "aws" {
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
          }
          EOF

          terraform -chdir=infra/terraform init -reconfigure -input=false
          terraform -chdir=infra/terraform plan -input=false -out=tfplan \
            -var alert_email=alerts@example.com \
            -var domain=example.com -var route53_zone_id=Z0000000000000000000
          terraform -chdir=infra/terraform show -json tfplan > "$RUNNER_TEMP/main-plan.json"

          # The same plan with the services started (Day 35): C36.11 and the cost read it
          terraform -chdir=infra/terraform plan -input=false -out=tfplan-started \
            -var alert_email=alerts@example.com \
            -var domain=example.com -var route53_zone_id=Z0000000000000000000 \
            -var start_services=true
          terraform -chdir=infra/terraform show -json tfplan-started > "$RUNNER_TEMP/started-plan.json"

      - name: LocalStack state bucket
        run: |
          awslocal s3 mb s3://jobmatch-microservices-tfstate
          terraform -chdir=infra/terraform/localstack init -input=false

      - name: lock test
        id: lock
        run: |
          # C32.3: Verify state locking prevents concurrent plans while apply waits for input.
          set +e
          FIFO="${RUNNER_TEMP:-/tmp}/terraform_input_$$"
          mkfifo "$FIFO"

          # Start apply in background, reading input from fifo
          terraform -chdir=infra/terraform/localstack apply -input=true < "$FIFO" > /tmp/apply.log 2>&1 &
          APPLY_PID=$!

          # Open fifo for writing and hold it open on fd 3
          exec 3>"$FIFO"

          # Wait up to 60 s for "Enter a value" prompt
          i=0
          while [ $i -lt 60 ]; do
            if grep -q "Enter a value" /tmp/apply.log 2>/dev/null; then
              break
            fi
            i=$((i + 1))
            sleep 1
          done

          if ! grep -q "Enter a value" /tmp/apply.log 2>/dev/null; then
            echo "ERROR: apply did not prompt for input within 60 s"
            cat /tmp/apply.log
            exec 3>&-
            rm -f "$FIFO"
            exit 1
          fi

          # Plan with lock timeout 0 must fail with lock error
          if terraform -chdir=infra/terraform/localstack plan -lock-timeout=0s -input=false > /tmp/plan_fail.log 2>&1; then
            echo "ERROR: the second plan got the state lock while apply held it"
            cat /tmp/apply.log
            cat /tmp/plan_fail.log
            exec 3>&-
            rm -f "$FIFO"
            exit 1
          fi

          if ! grep -q "Error acquiring the state lock" /tmp/plan_fail.log; then
            echo "ERROR: plan should have failed with 'Error acquiring the state lock'"
            cat /tmp/apply.log
            cat /tmp/plan_fail.log
            exec 3>&-
            rm -f "$FIFO"
            exit 1
          fi

          # Answer no to the apply
          echo "no" >&3
          exec 3>&-

          # Apply must exit with code 1
          wait $APPLY_PID
          APPLY_EXIT=$?
          if [ $APPLY_EXIT -ne 1 ]; then
            echo "ERROR: apply should have exited with code 1, got $APPLY_EXIT"
            cat /tmp/apply.log
            rm -f "$FIFO"
            exit 1
          fi

          rm -f "$FIFO"

          # Plan again must succeed
          set -e
          terraform -chdir=infra/terraform/localstack plan -lock-timeout=0s -input=false > /dev/null

      - name: apply on LocalStack
        id: apply
        run: terraform -chdir=infra/terraform/localstack apply -auto-approve -input=false

      - name: second apply makes no changes
        id: second-apply
        run: |
          set -o pipefail
          # C32.10: a second apply with nothing changed must print "No changes."
          terraform -chdir=infra/terraform/localstack apply -auto-approve -input=false -no-color | tee "$RUNNER_TEMP/second-apply.log"
          grep -q "No changes." "$RUNNER_TEMP/second-apply.log"

      - name: compose LocalStack
        run: |
          docker compose -p infra-ci --env-file .env.example up -d --wait localstack
          echo "COMPOSE_LOCALSTACK=http://$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' infra-ci-localstack-1):4566" >> "$GITHUB_ENV"

      - name: infra-checks.py
        id: infra-checks
        run: |
          python scripts/infra-checks.py \
            --bootstrap-plan "$RUNNER_TEMP/bootstrap-plan.json" \
            --main-plan "$RUNNER_TEMP/main-plan.json" \
            --started-plan "$RUNNER_TEMP/started-plan.json" \
            --localstack http://localhost:4566 \
            --compose-localstack "$COMPOSE_LOCALSTACK" \
            --summary "$RUNNER_TEMP/infra-checks.json"

      # The dashboard's Infrastructure panel reads this artifact (scripts/spec-drift.py, infra()).
      - name: infra summary
        if: always() && github.event_name == 'push'
        run: |
          python scripts/infra-summary.py \
            --main-plan "$RUNNER_TEMP/main-plan.json" \
            --started-plan "$RUNNER_TEMP/started-plan.json" \
            --checks "$RUNNER_TEMP/infra-checks.json" \
            --step fmt=${{ steps.fmt.outcome }} \
            --step validate=${{ steps.validate.outcome }} \
            --step collector=${{ steps.collector.outcome }} \
            --step plan=${{ steps.plan.outcome }} \
            --step lock=${{ steps.lock.outcome }} \
            --step apply=${{ steps.apply.outcome }} \
            --step second-apply=${{ steps.second-apply.outcome }} \
            --step infra-checks=${{ steps.infra-checks.outcome }} \
            --out "$RUNNER_TEMP/infra-summary.json"

      - name: upload infra summary
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: infra-summary
          path: ${{ runner.temp }}/infra-summary.json
          retention-days: 90
