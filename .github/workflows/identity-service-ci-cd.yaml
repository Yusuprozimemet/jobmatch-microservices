name: Identity Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "services/identity-service/**"
      # identity-service builds with the root wrapper and rules (Day 28).
      - "checkstyle.xml"
      - "mvnw"
      - ".mvn/**"
      # The suite also runs through the gateway, so a gateway change runs it too (Day 15).
      - "services/api-gateway/**"
      # Every run starts job-service from its image (Day 17), so a change to it runs the suite.
      - "services/job-service/**"
      # The harness starts matching-service from its image (Day 21), so a change to it runs the suite.
      - "services/matching-service/**"
      # The harness starts application-service from its image (Day 25), so a change to it runs the suite.
      - "services/application-service/**"
      # IdentityDbConnectTest reads both to compare the three role-setup copies (Day 42).
      - "scripts/db-init/**"
      - "scripts/db-setup.py"
      # The docs' link check below (Day 42).
      - "scripts/check-links.py"
      - ".github/workflows/identity-service-ci-cd.yaml"
  # Every pull request, so the gate below always reports: a required check that never starts
  # blocks the merge. The changes job decides whether the real jobs have anything to do.
  pull_request:
  workflow_dispatch:

# Cancel previous runs on new pushes
concurrency:
  group: docker-build-identity-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 0
  PATCH_VERSION: ${{ github.run_number }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
      own: ${{ steps.diff.outputs.own }}
    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The same paths as the push trigger's filter, which has already decided on a push. A manual run
      # deploys whatever is on main, so it always runs.
      - name: Compare with the base
        id: diff
        env:
          # identity's suite runs on the other services' changes, but its image changes only with its own
          # directory, so it is pushed only on these paths (Day 35).
          OWN: '^(services/identity-service/|\.github/workflows/identity-service-ci-cd\.yaml$)'
          PATHS: '^(checkstyle\.xml$|mvnw$|\.mvn/|services/(identity-service|api-gateway|job-service|matching-service|application-service)/|scripts/db-init/|scripts/db-setup\.py$|scripts/check-links\.py$|\.github/workflows/identity-service-ci-cd\.yaml$)'
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo run=true >> "$GITHUB_OUTPUT"; echo own=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ "${{ github.event_name }}" = push ] || grep -qE "$PATHS" <<< "$files"; then run=true; else run=false; fi
          if grep -qE "$OWN" <<< "$files"; then own=true; else own=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"
          echo "own=$own" | tee -a "$GITHUB_OUTPUT"

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every relative link in identity's README and docs points at a file that exists (Day 42).
      - name: Check the docs' links
        run: python3 scripts/check-links.py services/identity-service/README.md services/identity-service/docs/*.md

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Checkstyle
        working-directory: ./services/identity-service
        run: ../../mvnw -B checkstyle:check

      # Every integration test's context trusts job-service at its container's key set (Day 17),
      # so the harness starts it from this image, built here: never pulled.
      - name: Build the job-service image
        run: docker build -t jobmatch-job-service:harness services/job-service

      # The harness starts matching-service from this image (Day 21), never pulled.
      - name: Build the matching-service image
        run: docker build -t jobmatch-matching-service:harness services/matching-service

      # The harness starts application-service from this image (Day 25), never pulled.
      - name: Build the application-service image
        run: docker build -t jobmatch-application-service:harness services/application-service

      # Pull the DynamoDB emulator (Day 22): the harness's score table.
      - name: Pull the DynamoDB emulator
        run: docker pull amazon/dynamodb-local:3.3.1

      # `verify`, not `test`: the integration tests are the safety net for the microservices
      # split, so a pull request that breaks one has to fail here. They need a Docker daemon
      # for Testcontainers, which ubuntu-latest has.
      - name: Run tests
        working-directory: ./services/identity-service
        run: ../../mvnw -B verify

      # The Day 1-4 suite, and the stale-cookie and refresh tests, again through the API gateway
      # (Day 15): the harness starts this image in front of the application and sends every
      # request through it. The route-table self-test runs here too, and Day 21's hung-model and
      # tracing holds, which are about a request sent to the gateway. Google sign-in's linking
      # tests too (Day 28), so its pending-link cookie is checked through the gateway on every PR.
      # In addition to the run above, never instead: only that one shows identity still checks
      # tokens itself.
      - name: Build the gateway image
        run: docker build -t jobmatch-api-gateway:harness services/api-gateway

      - name: Run the suite through the gateway
        working-directory: ./services/identity-service
        run: >-
          ../../mvnw -B verify -pl app -am -Dharness.gateway=true
          -Dtest='nl.hackyourfuture.project.backend.contract.*IT,StaleCookieIT,RefreshIT,GatewayHarnessIT,ServiceRoutingIT,ObservabilityIT,JobServiceHarnessIT,JobServiceObservedIT,HungModelIT,TopMatchesTracedIT,GoogleLinkClaimIT,PendingGoogleLinksIT'
          -Dsurefire.failIfNoSpecifiedTests=false

  # Identity's image changes only with its own directory, so a push runs the build only for
  # those paths; a pull request always builds, and the suite above covers the rest.
  build:
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.run == 'true' && (github.event_name == 'pull_request' || needs.changes.outputs.own == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The deploy role is assumed through OIDC; no environment: here, or its token's sub would change.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/identity-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }},enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      - name: Build, and push to GHCR
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || vars.DEPLOY_ENABLED != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./services/identity-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=identity-service
          cache-to: type=gha,scope=identity-service,mode=max

      # With the switch off the image goes to GHCR as before, so merges after the destroy still
      # publish. Terraform's image_tag stays latest, so the deploy changes no task definition.
      - name: Assume the deploy role
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        id: ecr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate ECR metadata
        id: ecr-meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/jobmatch/identity-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build, and push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./services/identity-service
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-meta.outputs.tags }}
          labels: ${{ steps.ecr-meta.outputs.labels }}
          cache-from: type=gha,scope=identity-service

      # Flyway runs as a one-off ECS task before the deploy (plan.md). The task definition runs
      # :latest, which the step above has just pushed. The migrate task runs in the services'
      # subnets and security group, read from the service so the role needs no ec2 permission.
      - name: Run the migrations
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          network=$(aws ecs describe-services --cluster jobmatch --services identity-service \
            --query 'services[0].networkConfiguration' --output json)
          task=$(aws ecs run-task --cluster jobmatch --task-definition jobmatch-identity-service-migrate \
            --launch-type FARGATE --network-configuration "$network" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster jobmatch --tasks "$task"
          code=$(aws ecs describe-tasks --cluster jobmatch --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          aws logs get-log-events --log-group-name /ecs/jobmatch/identity-service-migrate \
            --log-stream-name "identity-service-migrate/identity-service-migrate/${task##*/}" \
            --limit 50 --query 'events[].message' --output text || true
          echo "exit code: $code"
          [ "$code" = 0 ]

      - name: Deploy to ECS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          aws ecs update-service --cluster jobmatch --service identity-service --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster jobmatch --services identity-service

  # The required check, named per workflow so the four do not share one name. It runs even when a
  # job before it failed or was skipped, since a skipped required check counts as passed: skipped
  # jobs pass here, failed or cancelled ones do not.
  gate:
    name: Identity Service gate
    if: always()
    needs: [changes, lint-and-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or had nothing to do
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
