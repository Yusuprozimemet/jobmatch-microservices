name: Job Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - "services/job-service/**"
      - "checkstyle.xml"
      - "mvnw"
      - ".mvn/**"
      - ".github/workflows/job-service-ci-cd.yaml"
  # Every pull request, so the gate below always reports: a required check that never starts
  # blocks the merge. The changes job decides whether the real jobs have anything to do.
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-build-job-service-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The same paths as the push trigger's filter, which has already decided on a push.
      - name: Compare with the base
        id: diff
        env:
          PATHS: '^(services/job-service/|checkstyle\.xml$|mvnw$|\.mvn/|\.github/workflows/job-service-ci-cd\.yaml$)'
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE "$PATHS" <<< "$files"; then run=true; else run=false; fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The backend's Maven wrapper and checkstyle rules, so the repository keeps one of each.
      - name: Run Checkstyle
        run: ./mvnw -B -f services/job-service/pom.xml checkstyle:check

      - name: Run tests
        run: ./mvnw -B -f services/job-service/pom.xml verify

  build:
    needs: [changes, lint-and-test]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # The deploy role is assumed through OIDC; no environment: here, or its token's sub would change.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/job-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      - name: Build, and push to GHCR
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || vars.DEPLOY_ENABLED != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./services/job-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=job-service
          cache-to: type=gha,scope=job-service,mode=max

      # With the switch off the image goes to GHCR as before, so merges after the destroy still
      # publish. Terraform's image_tag stays latest, so the deploy changes no task definition.
      - name: Assume the deploy role
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        id: ecr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate ECR metadata
        id: ecr-meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/jobmatch/job-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build, and push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./services/job-service
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-meta.outputs.tags }}
          labels: ${{ steps.ecr-meta.outputs.labels }}
          cache-from: type=gha,scope=job-service

      - name: Deploy to ECS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          aws ecs update-service --cluster jobmatch --service job-service --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster jobmatch --services job-service

  # The required check, named per workflow so the four do not share one name. It runs even when a
  # job before it failed or was skipped, since a skipped required check counts as passed: skipped
  # jobs pass here, failed or cancelled ones do not.
  gate:
    name: Job Service gate
    if: always()
    needs: [changes, lint-and-test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or had nothing to do
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
