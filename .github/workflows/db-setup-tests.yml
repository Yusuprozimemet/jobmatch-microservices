name: db-setup.py runs twice and matches its pin

# No other job runs scripts/db-setup.py, so a change to the roles and grants it creates
# could merge unseen. scripts/test_db_setup.py runs it twice against a fresh Postgres:
# the second run must change nothing, and the result must equal the pin in the test.
# The same script is the image the db-setup task runs (Day 36), so that image must build and print its help.
# The image also holds seed-mart.py and the two fixtures (the jobs-seed task): the seed runs against the
# Postgres after db-setup, and its second run must refuse.
# With DEPLOY_ENABLED on, a push to main (or a dispatch) sends the image to ECR; off, it pushes nothing.

on:
  # Every pull request, so the gate below always reports: a required check that never starts
  # blocks the merge. The changes job decides whether the real jobs have anything to do.
  pull_request:
  push:
    branches:
      - main
    paths:
      - scripts/db-setup.py
      - scripts/db-setup.Dockerfile
      - scripts/test_db_setup.py
      - scripts/seed-mart.py
      - scripts/test_seed_mart.py
      - services/identity-service/src/test/resources/fixtures/analytics-schema.sql
      - services/identity-service/src/test/resources/fixtures/analytics-seed.sql
      - .github/workflows/db-setup-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The same paths as the push trigger's filter, which has already decided on a push. A manual run
      # has no base to compare with, so it always runs.
      - name: Compare with the base
        id: diff
        env:
          PATHS: '^(scripts/(db-setup\.py|db-setup\.Dockerfile|test_db_setup\.py|seed-mart\.py|test_seed_mart\.py)$|services/identity-service/src/test/resources/fixtures/analytics-(schema|seed)\.sql$|\.github/workflows/db-setup-tests\.yml$)'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            if grep -qE "$PATHS" <<< "$files"; then run=true; else run=false; fi
          else
            run=true
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  test:
    name: db-setup.py runs twice and matches its pin
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The deploy role is assumed through OIDC; no environment: here, or its token's sub would change.
      id-token: write
    services:
      postgres:
        image: postgres:18.4-alpine
        # Password auth, so the db-setup test can check that each role logs in with its own
        # password. The container exists for one job and publishes only to the runner; its
        # password is the run's id, not a secret.
        env:
          POSTGRES_PASSWORD: ${{ format('dbsetup-{0}-{1}', github.run_id, github.run_attempt) }}
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" pytest
      - run: python -m pytest -q scripts/test_db_setup.py
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('dbsetup-{0}-{1}', github.run_id, github.run_attempt) }}
      - run: docker build --build-context fixtures=services/identity-service/src/test/resources/fixtures -t jobmatch-db-setup:ci -f scripts/db-setup.Dockerfile scripts
      - run: python -m pytest -q scripts/test_seed_mart.py
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ format('dbsetup-{0}-{1}', github.run_id, github.run_attempt) }}
          SEED_IMAGE: jobmatch-db-setup:ci
      - run: docker run --rm jobmatch-db-setup:ci --help

      - name: Assume the deploy role
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        id: ecr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          image=${{ steps.ecr.outputs.registry }}/jobmatch/db-setup
          for tag in "${GITHUB_SHA::7}" latest; do
            docker tag jobmatch-db-setup:ci "$image:$tag"
            docker push "$image:$tag"
          done

  # The required check, named per workflow so they do not share one name. It runs even when a job
  # before it failed or was skipped, since a skipped required check counts as passed: skipped jobs
  # pass here, failed or cancelled ones do not.
  gate:
    name: db-setup tests gate
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or had nothing to do
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
