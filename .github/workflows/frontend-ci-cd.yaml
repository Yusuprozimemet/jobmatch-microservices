name: Frontend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yaml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yaml"
  workflow_dispatch:

# Cancel previous runs on new pushes
concurrency:
  group: docker-build-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MAJOR_VERSION: 1
  MINOR_VERSION: 0
  PATCH_VERSION: ${{ github.run_number }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
      # The deploy role is assumed through OIDC; no environment: here, or its token's sub would change.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }},enable={{is_default_branch}}
            type=raw,value=${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }},enable={{is_default_branch}}
            type=sha,prefix=main-sha-,format=short,enable={{is_default_branch}}

      - name: Build, and push to GHCR
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || vars.DEPLOY_ENABLED != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=frontend,mode=max' || '' }}

      # With the switch off the image goes to GHCR as before, so merges after the destroy still
      # publish. Terraform's image_tag stays latest, so the deploy changes no task definition.
      - name: Assume the deploy role
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Log in to ECR
        id: ecr
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate ECR metadata
        id: ecr-meta
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/jobmatch/frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build, and push to ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr-meta.outputs.tags }}
          labels: ${{ steps.ecr-meta.outputs.labels }}
          cache-from: type=gha,scope=frontend

      - name: Deploy to ECS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          aws ecs update-service --cluster jobmatch --service frontend --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster jobmatch --services frontend
