spring:
  application:
    name: hyf-project-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:project_db}?currentSchema=${DB_SCHEMA:app}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:password}
  flyway:
    schemas: ${DB_SCHEMA:app}
    # Used for password reset emails
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080
  error:
    # Pinned so error responses look the same in dev and prod - devtools would otherwise
    # toggle these on in development.
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:jobmatch.team2026@gmail.com}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:${app.base-url}/api/login/oauth2/code/google}
    success-redirect: ${OAUTH2_SUCCESS_REDIRECT:${app.base-url}/}
    failure-redirect: ${OAUTH2_FAILURE_REDIRECT:${app.base-url}/login?error=oauth}
    link-required-redirect: ${OAUTH2_LINK_REDIRECT:${app.base-url}/login?error=google_link_required}
    # First Google sign-in lands here instead of home, since Google skips our terms screen.
    terms-required-redirect: ${OAUTH2_TERMS_REDIRECT:${app.base-url}/accept-terms}


  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${LLM_MODEL:gemini-flash-lite-latest}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
    # Sent as reasoning_effort - cuts response time for models that reason by default.
    # Leave empty for a provider that rejects the field.
    reasoning-effort: ${LLM_REASONING_EFFORT:low}
    # How long a stored score stays valid. Reads already skip expired ones; the hourly
    # purge just frees the space.
    score-retention-days: ${LLM_SCORE_RETENTION_DAYS:1}
    score-purge-cron: ${LLM_SCORE_PURGE_CRON:0 0 * * * *}

# API Docs
springdoc:
  api-docs:
    path: /api/docs/openapi.yaml
scalar:
  enabled: true
  path: /api/docs
  url: ${springdoc.api-docs.path}

# Observability. Actuator listens on its own port, which compose and the ingress do not
# publish, so nothing here is reachable from the internet: on the application port every
# /actuator/** path falls through to SecurityConfig's anyRequest().authenticated() and
# answers 401. That is what lets Prometheus scrape without the app growing a public
# metrics endpoint or a second set of credentials.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        # Only these two. Nothing else is worth the surface, and /actuator/env in
        # particular would hand out the whole configuration, secrets included.
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # Safe because this port is not published. It is also the only way an operator can
      # see which dependency is the reason the application says it is unhealthy.
      show-details: always
      show-components: always
  health:
    mail:
      # Off on purpose. The mail indicator opens an SMTP connection on every health check
      # and reports DOWN when the relay is unreachable, which drags the whole endpoint
      # DOWN with it. Phase 7 wires /actuator/health up as the Kubernetes readiness probe,
      # so leaving this on would pull the application out of the load balancer - nobody
      # could browse jobs - because password-reset email is undeliverable. Sending mail is
      # not a condition for serving traffic, and Day 31 moves it onto a queue regardless.
      enabled: false
  otlp:
    metrics:
      export:
        # Export is enabled by default and aims at a local collector, so an unset endpoint
        # means "retry forever against nothing", not "off". Off unless an endpoint is given.
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
