spring:
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    schemas: app

logging:
  level:
    root: INFO
  # One JSON object per line, so a log collector can index the fields instead of parsing
  # a message. Spring Boot writes this itself since 3.4 - no encoder dependency and no
  # logback-spring.xml. The formatter flattens MDC into the object, which is how trace_id
  # and span_id get there: the OpenTelemetry agent puts them in MDC on every request.
  #
  # Only in prod. Local development keeps the readable one-line format.
  structured:
    format:
      console: logstash

# Add any additional configuration for the production environment

app:
  # One login per module (Day 11), each with its own schema as the search path, so a write into
  # another module's schema is refused by Postgres. jobs owns nothing and reads the mart.
  datasource:
    identity:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=identity
      username: ${DB_IDENTITY_USER}
      password: ${DB_IDENTITY_PASSWORD}
    applications:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=applications
      username: ${DB_APPLICATIONS_USER}
      password: ${DB_APPLICATIONS_PASSWORD}
    matching:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=matching
      username: ${DB_MATCHING_USER}
      password: ${DB_MATCHING_PASSWORD}
    jobs:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=analytics
      username: ${DB_JOBS_USER}
      password: ${DB_JOBS_PASSWORD}
