version: 2

models:
  - name: stg_postings
    description: >
         Cleaned and standardized FreeHire job postings, with one latest row 
         per source job after deduplication across daily raw snapshots.
    columns:
      - name: source_job_id
        description: >
          Job identifier provided by the original source aggregated by FreeHire.
          Used together with original_source to identify a posting.
        tests: [not_null]
      - name: original_source
        description: >
          The underlying source from which FreeHire collected the job posting,
          for example whatjobs-nl or ukg.
        tests: [not_null]
      - name: public_slug
        description: Public job slug provided by FreeHire.
        tests: [not_null]
        
      - name: title
        description: Job title as advertised by the source.
        tests: [not_null]
      - name: company_name
        description: Hiring company name after basic trimming.
        tests: [not_null]
      - name: company_slug
        description: Company slug provided by FreeHire.
        
      - name: description_raw
        description: >
          Raw job description from FreeHire. HTML and other source formatting
          are intentionally preserved in staging and cleaned later.
        
      - name: source_url
        description: URL of the original job posting.
        tests: [not_null]
      - name: location_raw
        description: > 
          Location string exactly as provided by FreeHire after basic trimming.
          City and country normalization happens downstream.

      - name: countries_raw
        description: Country codes provided by FreeHire as an array.
        
      - name: regions_raw
        description:  Region codes provided by FreeHire as an array.
        
      - name: cities_raw
        description: >
          City values provided by FreeHire as an array. These values are not
          assumed to be fully reliable and are normalized downstream.
        
      - name: skills_raw
        description: >
          Skills or related concepts provided by FreeHire before our own
          normalization or classification.
        
      - name: source_work_mode
        description: >
          Work mode provided by FreeHire, such as remote, hybrid or onsite.
          May be null.
        
      - name: source_category
        description: Job category assigned by FreeHire enrichment.
        
      - name: source_employment_type
        description: Employment type assigned by FreeHire enrichment.
        
      - name: source_experience_level
        description: Seniority level assigned by FreeHire enrichment.
        
      - name: source_experience_years_min
        description: Minimum years of experience detected by FreeHire enrichment.

      - name: source_education_level
        description: Education level detected by FreeHire enrichment.

      - name: source_posting_language
        description: Language detected for the job posting.

      - name: requirements_raw
        description: >
          Structured requirements provided by FreeHire, including required
          and preferred requirements. These are transformed downstream.

      - name: source_salary_min
        description: Minimum salary provided by FreeHire enrichment.

      - name: source_salary_max
        description: Maximum salary provided by FreeHire enrichment.

      - name: source_salary_currency
        description: Currency of the source salary, for example EUR.

      - name: source_salary_period
        description: Salary period provided by FreeHire, such as month or year.

      - name: source_company_type
        description: Company type assigned by FreeHire enrichment.

      - name: source_company_size
        description: Company size assigned by FreeHire enrichment.

      - name: source_is_tech
        description: FreeHire classification indicating tech or non-tech.

      - name: posted_at
        description: When the job posting was published at the source.
        tests: [not_null]

      - name: source_created_at
        description: When the job record was created by FreeHire.

      - name: updated_at
        description: When FreeHire last updated the job record.

      - name: last_seen_at
        description: Last time FreeHire observed the posting.

      - name: closed_at
        description: >
          Timestamp when FreeHire marked the posting as closed. Null means no
          closure timestamp was provided.

      - name: source_freshness_class
        description: Freshness classification supplied by FreeHire.

      - name: source_age_days
        description: Job age in days reported by FreeHire.

      - name: source_repost_count
        description: Number of reposts reported by FreeHire.

      - name: source_mass_posting_count
        description: Mass-posting count reported by FreeHire.

      - name: source_fake_freshness
        description: Whether FreeHire flagged the posting as having fake freshness.

      - name: source_file
        description: Raw Azure/Databricks file path from which the row was read.
        tests: [not_null]

      - name: ingest_date
        description: >
          The day whose partition folder this row was read from, taken from
          `ingest_date=<date>`. This is when our pipeline saw the job, not when
          the job itself was originally posted.
        tests: [not_null]

      - name: ingested_at
        description: >
          File modification timestamp used to determine the newest snapshot of
          a posting.
        tests: [not_null]
        